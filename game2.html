<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여명의 갈림길 — Crossroads of Dawn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181611;
    --paper:#eee4cc;
    --paper-dark:#e2d5b5;
    --paper-line:#c9b98f;
    --gold:#a87f3f;
    --gold-bright:#c9994f;
    --seal:#8a3327;
    --seal-dim:#7a4a42;
    --teal:#3c5a54;
    --navy:#232c39;
    --ok:#4c6b4a;
    --warn:#8a3327;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, #22201a 0%, #0f0e0b 60%),
      var(--ink);
    color:var(--paper);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .stage{
    max-width:920px;
    margin:0 auto;
    padding:28px 18px 80px;
    min-height:100vh;
  }
  ::selection{background:var(--gold); color:#181611;}

  /* ---------- top masthead ---------- */
  .masthead{
    text-align:center;
    padding:18px 0 22px;
    border-bottom:2px solid var(--gold);
    margin-bottom:26px;
    position:relative;
  }
  .masthead .era{
    font-family:'Noto Sans KR';
    font-size:11px;
    letter-spacing:.35em;
    color:var(--gold-bright);
    margin-bottom:10px;
  }
  .masthead h1{
    font-family:'Noto Serif KR';
    font-weight:900;
    font-size:clamp(28px,5vw,44px);
    margin:0 0 6px;
    letter-spacing:.04em;
    color:var(--paper);
  }
  .masthead .sub{
    font-family:'Noto Serif KR';
    font-size:14px;
    color:#b7ab86;
    font-weight:500;
    letter-spacing:.08em;
  }

  /* ---------- panels ---------- */
  .panel{
    background:var(--paper);
    color:var(--ink);
    border-radius:2px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.015) 0px, rgba(0,0,0,.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }

  /* ---------- intro screen ---------- */
  .intro-panel{padding:36px 34px;}
  .intro-panel h2{
    font-family:'Noto Serif KR'; font-weight:700; font-size:22px; margin:0 0 14px;
    border-bottom:1px solid var(--paper-line); padding-bottom:12px;
  }
  .intro-panel p{ line-height:1.85; font-size:15px; margin:0 0 14px; color:#332c1f;}
  .intro-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:22px 0 8px;
  }
  .stat-chip{
    background:rgba(0,0,0,.04); border:1px solid var(--paper-line);
    padding:10px 8px; text-align:center; border-radius:2px;
  }
  .stat-chip .name{font-size:11px; color:#6b5f45; letter-spacing:.05em;}
  .stat-chip .icon{font-size:18px; margin:4px 0;}
  .btn-row{display:flex; justify-content:center; margin-top:24px;}
  .btn{
    font-family:'Noto Serif KR'; font-weight:700; font-size:15px;
    background:var(--seal); color:#f4e9d8; border:none; padding:14px 40px;
    cursor:pointer; letter-spacing:.06em; border-radius:2px;
    box-shadow:0 4px 0 #5c231b; transition:transform .08s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(2px); box-shadow:0 2px 0 #5c231b;}
  .btn.secondary{
    background:transparent; color:var(--paper); border:1px solid var(--gold);
    box-shadow:none;
  }
  .btn.small{padding:9px 20px; font-size:13px;}

  /* ---------- character select ---------- */
  .char-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-top:22px;
  }
  @media(max-width:640px){.char-grid{grid-template-columns:1fr;}}
  .char-card{
    background:var(--paper); color:var(--ink); border-radius:2px; cursor:pointer;
    box-shadow:var(--shadow); overflow:hidden; border:2px solid transparent;
    transition:border-color .15s ease, transform .15s ease;
    position:relative;
  }
  .char-card:hover{border-color:var(--gold); transform:translateY(-3px);}
  .char-card.selected{border-color:var(--seal);}
  .char-top{display:flex; gap:14px; padding:16px 16px 10px;}
  .char-portrait{
    width:76px; height:76px; border-radius:50%; object-fit:cover;
    border:3px solid var(--gold); flex-shrink:0; background:#000;
  }
  .char-name{font-family:'Noto Serif KR'; font-weight:700; font-size:19px; margin:2px 0 3px;}
  .char-tag{
    display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px;
    color:#fff; letter-spacing:.03em;
  }
  .tag-yeo{background:#4d6b57;}
  .tag-kim{background:#5a4a3a;}
  .tag-lee{background:#5c6a80;}
  .tag-park{background:#8a3327;}
  .char-goal{font-size:12.5px; color:#5a4f39; margin-top:6px; line-height:1.5;}
  .char-body{padding:0 16px 16px;}
  .char-line{display:flex; justify-content:space-between; font-size:12px; padding:3px 0; border-top:1px dashed var(--paper-line);}
  .char-line b{color:#332c1f;}

  /* ---------- game hud ---------- */
  .hud{
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px;
  }
  .hud-stat{
    background:var(--paper); border-radius:2px; padding:10px 10px 8px; box-shadow:var(--shadow);
    color:var(--ink);
  }
  .hud-stat .lbl{font-size:10.5px; color:#6b5f45; display:flex; justify-content:space-between; margin-bottom:6px;}
  .hud-stat .lbl span.val{font-weight:700; color:var(--ink);}
  .bar-track{height:7px; background:#d8caa4; border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:4px; transition:width .5s ease;}
  .fill-public{background:#4c6b4a;}
  .fill-intl{background:#3c5a80;}
  .fill-unity{background:#a87f3f;}
  .fill-security{background:#8a3327;}

  .chapter-banner{
    text-align:center; margin:20px 0 16px;
  }
  .chapter-banner .num{font-size:11px; letter-spacing:.3em; color:var(--gold-bright);}
  .chapter-banner h2{font-family:'Noto Serif KR'; font-size:24px; margin:6px 0 2px; font-weight:700;}
  .chapter-banner .date{font-size:12.5px; color:#a89b78;}

  .event-panel{padding:26px 28px;}
  .event-role{
    display:flex; align-items:center; gap:12px; margin-bottom:14px;
  }
  .event-role img{width:52px; height:52px; border-radius:50%; object-fit:cover; border:2px solid var(--seal);}
  .event-role .who{font-family:'Noto Serif KR'; font-weight:700; font-size:16px;}
  .event-role .who small{display:block; font-weight:400; font-size:11.5px; color:#6b5f45; font-family:'Noto Sans KR';}
  .event-text{font-size:15px; line-height:1.9; color:#2a2417; margin-bottom:20px;}
  .event-text b{color:var(--seal);}

  .choice-list{display:flex; flex-direction:column; gap:10px;}
  .choice{
    text-align:left; background:#f7efdc; border:1px solid var(--paper-line);
    padding:14px 16px; cursor:pointer; border-radius:2px; font-family:'Noto Sans KR';
    font-size:14.5px; color:#2a2417; line-height:1.6; transition:background .12s, border-color .12s;
  }
  .choice:hover{background:#fff8e8; border-color:var(--gold);}
  .choice:disabled{opacity:.45; cursor:default;}
  .choice .delta{display:block; margin-top:6px; font-size:11.5px; color:#8a7a55;}

  /* result flash after a choice */
  .result-box{
    background:#2c2418; color:#eee4cc; padding:16px 18px; border-radius:2px; margin-top:16px;
    border-left:4px solid var(--gold); font-size:14px; line-height:1.8;
  }
  .result-box .tag{
    display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:10px;
    letter-spacing:.05em; margin-bottom:8px; font-weight:700;
  }
  .tag-fact{background:#4c6b4a; color:#fff;}
  .tag-if{background:#3c5a80; color:#fff;}

  /* ---------- ending ---------- */
  .ending-panel{padding:34px 30px; text-align:center;}
  .ending-seal{
    width:88px; height:88px; border-radius:50%; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center;
    border:3px solid var(--seal); color:var(--seal); font-family:'Noto Serif KR';
    font-weight:900; font-size:13px; letter-spacing:.05em; text-align:center; line-height:1.3;
  }
  .ending-panel .kicker{font-size:11px; letter-spacing:.3em; color:#8a7a55; margin-bottom:8px;}
  .ending-panel h2{font-family:'Noto Serif KR'; font-size:26px; margin:0 0 16px; font-weight:800; color:var(--seal);}
  .ending-panel .story{font-size:15px; line-height:1.9; color:#2a2417; text-align:left; max-width:620px; margin:0 auto 22px;}

  .archive{
    background:#e2d5b5; border-radius:2px; padding:22px 24px; margin-top:8px; text-align:left;
  }
  .archive h3{font-family:'Noto Serif KR'; font-size:16px; margin:0 0 14px; border-bottom:1px solid var(--paper-line); padding-bottom:8px;}
  .archive-row{
    display:grid; grid-template-columns:110px 1fr 1fr; gap:10px; padding:10px 0; border-top:1px dashed var(--paper-line);
    font-size:12.5px; align-items:start;
  }
  .archive-row:first-of-type{border-top:none;}
  .archive-row .chlabel{font-weight:700; color:#5a4f39;}
  .archive-row .colhead{font-size:10px; letter-spacing:.05em; color:#8a7a55; margin-bottom:3px; display:block;}
  .archive-row .yourpick{color:#2a2417;}
  .archive-row .actual{color:#5a4f39;}
  .match-yes{color:var(--ok); font-weight:700;}
  .match-no{color:var(--seal); font-weight:700;}

  .footer-actions{margin-top:26px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

  .progress-dots{display:flex; justify-content:center; gap:6px; margin:18px 0 6px;}
  .dot{width:7px; height:7px; border-radius:50%; background:#443c2c;}
  .dot.active{background:var(--gold-bright);}
  .dot.done{background:var(--seal);}

  .hidden{display:none !important;}

  /* =========================================================
     [시각 개선] 학생 시점 가독성·직관성 보강 (원래 스타일 위에 덧씀)
  ========================================================= */
  body{word-break:keep-all;}  /* 한글 단어 중간 줄바꿈 방지 */
  /* 초상화: 배경 제거 이미지 + 인물별 색 원판 */
  .pbg-yeo{background:#d6e0d4;} .pbg-kim{background:#ddd2c2;}
  .pbg-lee{background:#d5dbe4;} .pbg-park{background:#e6cfc9;}
  .ring-yeo{border-color:#4d6b57 !important;} .ring-kim{border-color:#5a4a3a !important;}
  .ring-lee{border-color:#5c6a80 !important;} .ring-park{border-color:#8a3327 !important;}
  .char-portrait{width:84px; height:84px; object-position:center 15%;}
  .char-name{font-size:21px;}
  .char-tag{font-size:12px; padding:3px 9px;}
  .char-goal{font-size:14px;}
  .char-line{font-size:13.5px; padding:5px 0;}

  /* 소개 화면 수치 설명 */
  .stat-chip{padding:12px 10px;}
  .stat-chip .icon{font-size:24px;}
  .stat-chip .name{font-size:13.5px; font-weight:700; color:#332c1f; letter-spacing:0;}
  .stat-chip .hint{font-size:12px; color:#6b5f45; margin-top:4px; line-height:1.45;}

  /* 인물 선택: 좌-우 스펙트럼 */
  .spectrum{margin:18px 0 8px; padding:14px 14px 10px; background:rgba(0,0,0,.035); border:1px solid var(--paper-line); border-radius:2px;}
  .spec-ends{display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; color:#6b5f45; padding:0 4px;}
  .spec-line{position:relative; height:148px; margin:4px 5% 0;}
  .spec-axis{position:absolute; left:-4%; right:-4%; top:38px; height:4px; background:var(--paper-line); border-radius:2px;}
  .spec-node{position:absolute; top:0; transform:translateX(-50%); width:120px; background:none; border:none; padding:0;
    cursor:pointer; text-align:center; font-family:inherit; color:var(--ink);}
  .spec-portrait{width:76px; height:76px; border-radius:50%; object-fit:cover; object-position:center 15%; border:3px solid; display:block; margin:0 auto 6px;
    transition:transform .15s ease;}
  .spec-name{font-family:'Noto Serif KR'; font-weight:700; font-size:15px; margin-bottom:3px;}
  .spec-caption{font-size:11.5px; color:#8a7a55; margin-top:6px; text-align:center;}
  .mini-caption{font-size:12px; color:#8a7a55; margin:2px 0 6px;}
  .mini-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px;}
  .mini-top{display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:4px;}
  .mini-top b{font-size:14px;}
  .mini .bar-track{height:6px;}
  .char-pick{margin-top:10px; text-align:center; font-family:'Noto Serif KR'; font-weight:700; font-size:14px;
    color:var(--seal); border:1.5px solid var(--seal); background:#f7efdc; padding:8px; border-radius:2px;}
  .char-card:active .char-pick{background:var(--seal); color:#f4e9d8;}

  /* 게임 HUD: 화면 위에 고정, 글자 확대, 위험 표시 */
  .hud{position:sticky; top:0; z-index:20; padding:8px 0; margin:-8px 0 10px;
    background:rgba(15,14,11,.93); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);}
  .hud-stat{padding:10px 12px 9px; position:relative; transition:box-shadow .2s;}
  .hud-stat .lbl{font-size:13px; align-items:center; color:#4a4030;}
  .hud-stat .lbl span.val{font-size:18px; display:flex; align-items:center; gap:4px;}
  .bar-track{height:10px; position:relative;}
  .bar-fill{position:relative; transition:width .8s cubic-bezier(.3,.8,.3,1);}
  .danger-zone{position:absolute; left:0; top:0; bottom:0; z-index:0;
    background:repeating-linear-gradient(135deg, rgba(138,51,39,.35) 0 3px, transparent 3px 6px);}
  .delta{font-style:normal; font-size:12px; font-weight:700; padding:1px 5px; border-radius:8px; animation:pop .5s ease;}
  .delta.up{background:#dfe9dc; color:#3d6b3a;} .delta.down{background:#f0d6d0; color:#8a3327;}
  @keyframes pop{0%{transform:scale(.4); opacity:0;} 60%{transform:scale(1.2); opacity:1;} 100%{transform:scale(1);}}
  .hud-stat.is-danger{box-shadow:0 0 0 2px #b0443a, var(--shadow); animation:dangerPulse 1.6s ease-in-out infinite;}
  @keyframes dangerPulse{50%{box-shadow:0 0 0 4px rgba(176,68,58,.45), var(--shadow);}}
  .hud-stat .warn{font-size:11.5px; font-weight:700; color:#8a3327; margin-top:4px;}

  /* 진행 타임라인 */
  .timeline{display:grid; grid-template-columns:repeat(5,1fr); margin:14px 0 4px; position:relative;}
  .tl-step{text-align:center; position:relative;}
  .tl-step::before{content:""; position:absolute; top:14px; left:-50%; width:100%; height:2px; background:#443c2c; z-index:0;}
  .tl-step:first-child::before{display:none;}
  .tl-step.done::before, .tl-step.active::before{background:var(--seal);}
  .tl-node{position:relative; z-index:1; width:30px; height:30px; margin:0 auto; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
    background:#2a261d; color:#8a7f66; border:2px solid #443c2c;}
  .tl-step.done .tl-node{background:var(--seal); border-color:var(--seal); color:#f4e9d8;}
  .tl-step.active .tl-node{background:var(--gold-bright); border-color:#f0d9a8; color:#181611; transform:scale(1.18); box-shadow:0 0 0 4px rgba(201,153,79,.25);}
  .tl-date{font-size:12px; color:#8a7f66; margin-top:6px;}
  .tl-step.active .tl-date{color:var(--gold-bright); font-weight:700;}
  .chapter-banner{margin:14px 0 16px;}
  .chapter-banner .num{font-size:12px;}
  .chapter-banner h2{font-size:26px;}
  .chapter-banner .date{font-size:14px;}

  /* 사건 패널 */
  .event-role img.role-portrait{width:68px; height:68px; object-position:center 15%; border:3px solid;}
  .event-role .who{font-size:18px;}
  .event-role .who small{font-size:13px;}
  .event-text{font-size:16px; margin-bottom:14px;}
  .dilemma{background:#f7e8d0; border-left:5px solid var(--seal); padding:12px 16px; margin-bottom:18px;
    font-family:'Noto Serif KR'; font-weight:700; font-size:17px; line-height:1.6; color:#5c231b;}
  .dilemma-label{display:block; font-family:'Noto Sans KR'; font-size:12px; font-weight:700; color:var(--seal); margin-bottom:2px;}

  /* 선택지: A/B/C 표시, 고른 것 강조 */
  .choice{display:flex; gap:12px; align-items:flex-start; font-size:15.5px; padding:14px 16px; min-height:56px; position:relative;}
  .choice-key{flex-shrink:0; width:28px; height:28px; border-radius:50%; border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:var(--gold); margin-top:-1px;}
  .choice-text{flex:1;}
  .choice:disabled{opacity:.4;}
  .choice.picked:disabled{opacity:1; background:#fff4de; border:2px solid var(--seal); box-shadow:0 2px 0 rgba(138,51,39,.25);}
  .choice.picked .choice-key{background:var(--seal); border-color:var(--seal); color:#fff;}
  .choice.picked::after{content:"내 선택"; position:absolute; right:10px; top:-10px; background:var(--seal); color:#fff;
    font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:10px;}

  /* 선택 결과: 수치 변화 칩 */
  .result-box{font-size:15px;}
  .result-box .tag{font-size:12px; padding:3px 9px;}
  .dchips{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .dchip{font-size:12.5px; padding:4px 10px; border-radius:12px; background:rgba(255,255,255,.08); color:#d8ccb0;}
  .dchip b{margin-left:2px;}
  .dchip.up{background:#3d5a3a; color:#e4f0df;} .dchip.down{background:#6e2a21; color:#f6dfd9;}
  .dchip.zero{opacity:.6;}

  /* 엔딩: 초상 + 도장, 요약, 수치 비교 */
  .ending-head{display:flex; justify-content:center; align-items:center; gap:14px; margin-bottom:6px;}
  .ending-head .ending-seal{margin:0;}
  .end-portrait{width:88px; height:88px; border-radius:50%; object-fit:cover; object-position:center 15%; border:3px solid;}
  .end-who{font-size:14px; color:#6b5f45; margin-bottom:4px;}
  .ending-panel .kicker{font-size:12px;}
  .ending-panel .story{font-size:16px;}
  .ending-panel .btn.secondary{color:var(--seal); border-color:var(--seal); background:#f7efdc;}
  .summary{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:0 0 12px; text-align:left;}
  .summary-block{background:#e2d5b5; padding:16px 18px; border-radius:2px;}
  .summary-block h3{font-family:'Noto Serif KR'; font-size:15.5px; margin:0 0 12px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .summary-block .count{font-family:'Noto Sans KR'; font-size:12.5px; font-weight:400; color:#6b5f45;}
  .summary-block .count b{font-size:17px; color:var(--seal);}
  .stamps{display:grid; grid-template-columns:repeat(5,1fr); gap:6px;}
  .stamp{text-align:center;}
  .st-mark{width:40px; height:40px; margin:0 auto 4px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:19px; font-weight:900; border:2px solid;}
  .stamp.yes .st-mark{color:#fff; background:var(--ok); border-color:var(--ok);}
  .stamp.no .st-mark{color:var(--seal); border-color:var(--seal); background:#f7efdc;}
  .stamp.na .st-mark{color:#3c5a80; border-color:#3c5a80; border-style:dashed; background:#f7efdc;}
  .stamp.skip .st-mark{color:#a89b78; border-color:#c9b98f; border-style:dotted;}
  .st-lbl{font-size:12.5px; font-weight:700; color:#332c1f;}
  .st-sub{font-size:11px; color:#6b5f45;}
  .cmp-row{display:grid; grid-template-columns:118px 1fr 92px; gap:8px; align-items:center; margin-bottom:9px; font-size:12.5px;}
  .cmp-track{height:10px; overflow:visible;}
  .cmp-start{position:absolute; top:-4px; width:2px; height:18px; background:#181611; transform:translateX(-1px);}
  .cmp-val{font-size:12.5px; text-align:right; white-space:nowrap;}
  .cmp-val .up{color:#3d6b3a; font-weight:700;} .cmp-val .down{color:#8a3327; font-weight:700;} .cmp-val .zero{color:#8a7a55;}
  .archive-row{font-size:13.5px;}
  .archive-row .colhead{font-size:11.5px;}
  .match-na{color:#3c5a80; font-weight:700;}

  /* 태블릿 터치: 눌린 채 떠 있는 hover 효과 제거 */
  @media (hover:none){
    .char-card:hover{transform:none; border-color:transparent;}
    .choice:hover{background:#f7efdc; border-color:var(--paper-line);}
    .btn:hover{transform:none;}
  }
  @media (hover:hover){ .spec-node:hover .spec-portrait{transform:scale(1.08);} }
  .char-card:active{border-color:var(--seal);}
  .spec-node:active .spec-portrait{transform:scale(1.08);}


  /* =========================================================
     [고민 장치] 정보 카드 · 참모 조언 · 이유 입력 · 기록 제출
  ========================================================= */
  .brief{margin:4px 0 18px;}
  .intel-card{background:#f5ecd6; border:1px solid var(--paper-line); padding:12px 16px; margin-bottom:14px;
    box-shadow:inset 0 0 0 4px rgba(255,255,255,.35);}
  .intel-head{font-size:12.5px; font-weight:700; color:#6b5f45; margin-bottom:5px;}
  .intel-body{font-size:15px; line-height:1.8; color:#2a2417;}
  .adv-head{font-family:'Noto Serif KR'; font-weight:700; font-size:15px; color:#332c1f; margin-bottom:8px;}
  .adv-head span{font-family:'Noto Sans KR'; font-weight:400; font-size:12.5px; color:#6b5f45;}
  .advisors{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .advisor{background:#fbf5e6; border:1px solid var(--paper-line); border-top:3px solid #6b5f45; padding:10px 12px 12px; border-radius:2px;}
  .adv-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .adv-badge{font-size:12px; font-weight:700; color:#fff; background:#5a4f39; padding:2px 8px; border-radius:10px;}
  .adv-role{font-size:12px; font-weight:700; color:#8a7a55;}
  .adv-text{font-size:14.5px; line-height:1.7; color:#2a2417;}

  .choice.selected{background:#fff4de; border:2px solid var(--gold); padding:13px 15px;}
  .choice.selected .choice-key{background:var(--gold); color:#fff;}

  .reason-box{margin-top:12px; background:#fbf5e6; border:2px dashed var(--gold); padding:12px 14px; border-radius:2px;}
  .reason-box label{display:block; font-size:14.5px; font-weight:700; color:#332c1f; margin-bottom:8px;}
  .reason-box label b{color:var(--seal);}
  .reason-box label span{display:block; font-weight:400; font-size:12.5px; color:#6b5f45; margin-top:2px;}
  .reason-box textarea{width:100%; box-sizing:border-box; font-family:'Noto Sans KR'; font-size:15px; line-height:1.6;
    padding:10px 12px; border:1px solid var(--paper-line); background:#fff; border-radius:2px; resize:vertical; color:#2a2417;}
  .reason-box textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .reason-foot{display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:10px;}
  #reason-count{font-size:12.5px; color:#8a3327;}
  #reason-count.ok{color:var(--ok); font-weight:700;}
  .btn:disabled{background:#b9ab8a; box-shadow:0 4px 0 #8f8266; cursor:not-allowed; transform:none;}
  .reason-done{margin-top:12px; font-size:14.5px; line-height:1.7; color:#2a2417; background:#fbf5e6; border-left:4px solid var(--gold); padding:8px 12px;}
  .reason-done span{display:block; font-size:12px; font-weight:700; color:#8a7a55;}

  .tag-result{background:#5a4f39; color:#fff;}
  .reveal{margin-top:14px; padding:10px 12px; background:rgba(201,153,79,.14); border:1px solid rgba(201,153,79,.45); font-size:14px; line-height:1.75; border-radius:2px;}
  .reveal span{display:block; font-size:12.5px; font-weight:700; color:var(--gold-bright); margin-bottom:3px;}
  .fact-hint{font-size:12px; color:#a89b78; margin-top:10px;}
  .fact-hint:empty{display:none;}

  .yourreason{margin-top:6px; padding:6px 8px; background:rgba(255,255,255,.45); border-left:3px solid var(--gold); color:#2a2417;}
  .submit-box{margin-top:14px; background:#e2d5b5; padding:14px 18px; text-align:left; border-radius:2px;}
  .submit-title{font-family:'Noto Serif KR'; font-weight:700; font-size:15px; margin-bottom:8px;}
  .submit-row{display:flex; gap:8px; flex-wrap:wrap;}
  .submit-row input{flex:1; min-width:180px; font-size:15px; padding:9px 12px; border:1px solid var(--paper-line); background:#fff; border-radius:2px; font-family:'Noto Sans KR';}
  .submit-help{font-size:12.5px; color:#6b5f45; margin-top:6px;}
  .submit-help.ok{color:var(--ok); font-weight:700;}

  @media(max-width:900px){ .advisors{grid-template-columns:1fr;} }


  /* [이유 쓰기] 단계형 판단 상자 · 판단 패턴 · 실제 인물 근거 */
  .reason-title{font-size:15px; font-weight:700; color:#332c1f; margin-bottom:10px;}
  .reason-title b{color:var(--seal);}
  .reason-title span{font-weight:400; font-size:12.5px; color:#6b5f45; margin-left:6px;}
  .rstep{margin-bottom:12px;}
  .rq{font-size:14px; font-weight:700; color:#332c1f; margin-bottom:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .rq small{font-weight:400; color:#8a7a55; font-size:12px;}
  .rq b.k{color:var(--ok);} .rq b.r{color:var(--seal);}
  .rnum{width:22px; height:22px; border-radius:50%; background:#5a4f39; color:#fff; font-size:12px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  .rsentence{font-family:'Noto Serif KR'; font-size:15px;}
  .rsentence b{color:var(--seal); background:#f7e8d0; padding:0 1px; border-radius:2px;}
  .rsentence i{font-style:normal; color:#a89b78;}
  .rchips{display:flex; flex-wrap:wrap; gap:6px;}
  .rchip{font-family:'Noto Sans KR'; font-size:14px; padding:8px 13px; min-height:38px; border-radius:19px; cursor:pointer;
    border:1.5px solid var(--paper-line); background:#fff; color:#4a4030;}
  .rchip.on{background:#5a4f39; border-color:#5a4f39; color:#fff; font-weight:700;}
  .rchip.dark{background:transparent; color:#eee4cc; border-color:rgba(201,153,79,.6);}
  .rchip.dark.on{background:var(--gold); border-color:var(--gold); color:#181611;}
  .rd-src{font-size:12.5px; color:#6b5f45; margin-bottom:2px;}
  .rd-rethink{font-size:12.5px; color:#3c5a80; font-weight:700; margin-top:3px;}
  .rethink{margin-top:10px; padding-top:10px; border-top:1px dashed rgba(201,153,79,.45);}
  .rethink-q{font-size:14px; font-weight:700; color:#eee4cc; margin-bottom:6px;}
  .rethink-btns{display:flex; gap:6px; flex-wrap:wrap;}

  .pattern{background:#efe3c6; border:1px solid var(--paper-line); padding:16px 18px; margin:0 0 12px; text-align:left; border-radius:2px;}
  .pattern h3{font-family:'Noto Serif KR'; font-size:15.5px; margin:0 0 6px;}
  .p-sum{font-size:15px; line-height:1.7; margin:0 0 10px; color:#2a2417;}
  .p-sum b{color:var(--seal);}
  .p-row{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:6px;}
  .p-lbl{width:110px; font-size:12.5px; font-weight:700; color:#6b5f45;}
  .pchip{font-size:13px; padding:3px 10px; border-radius:12px; background:#fff; border:1px solid var(--paper-line);}
  .pchip b{margin-left:3px;}
  .pchip.k{border-color:#4c6b4a; color:#3d5a3a;} .pchip.r{border-color:#8a3327; color:#8a3327;} .pchip.s{border-color:#3c5a80; color:#3c5a80;}

  .archive-note{font-size:12px; color:#8a7a55; margin:-6px 0 8px;}
  .histreason{margin-top:8px; padding:6px 8px; background:rgba(60,90,128,.08); border-left:3px solid #3c5a80; color:#2a2417; line-height:1.65;}
  .final-reflect{margin-top:14px; background:#e2d5b5; padding:14px 18px; text-align:left; border-radius:2px;}
  .final-reflect label{display:block; font-size:14px; color:#332c1f; margin-bottom:8px; line-height:1.6;}
  .final-reflect textarea{width:100%; box-sizing:border-box; font-family:'Noto Sans KR'; font-size:15px; line-height:1.6; padding:10px 12px;
    border:1px solid var(--paper-line); background:#fff; border-radius:2px; resize:vertical;}
  @media(max-width:640px){ .p-lbl{width:100%;} }

  /* 좁은 화면(폰·태블릿 세로 분할) */
  @media(max-width:900px){
    .hud-stat .lbl{flex-direction:column; align-items:flex-start; gap:2px; font-size:12px;}
    .hud-stat .lbl span.val{font-size:17px;}
  }
  @media(max-width:760px){
    .summary{grid-template-columns:1fr;}
  }
  @media(max-width:640px){
    .intro-grid{grid-template-columns:repeat(2,1fr);}
    .hud{grid-template-columns:repeat(2,1fr);}
    .spec-node{width:84px;} .spec-portrait{width:54px; height:54px;} .spec-line{height:130px;} .spec-axis{top:27px;}
    .spec-name{font-size:13px;} .spec-node .char-tag{display:none;} .spec-line{height:100px;}
    .hud{gap:6px;} .hud-stat{padding:7px 9px;} .hud-stat .warn{display:none;}
    .tl-date{font-size:10.5px;}
    .archive-row{grid-template-columns:1fr;}
    .cmp-row{grid-template-columns:1fr auto; row-gap:4px;} .cmp-val{order:2;} .cmp-track{order:3; grid-column:1/-1;}
    .event-panel{padding:20px 18px;}
  }
</style>

function show(id){
  ['screen-intro','screen-select','screen-game','screen-ending'].forEach(s=>{
    $('#'+s).classList.toggle('hidden', s!==id);

function clamp(v){ return Math.max(0, Math.min(100, v)); }

   [시각 개선] 화면 표시용 설정 — 게임 규칙에는 영향 없음
========================================================= */
const STAT_META = [
  {key:'public',   label:'대중 지지도',    icon:'👥', fill:'fill-public',   hint:'국민이 나를 얼마나 지지하는가'},
  {key:'intl',     label:'국제 세력 관계', icon:'🌐', fill:'fill-intl',     hint:'미군정·소련 등 외부 세력과의 관계'},
  {key:'unity',    label:'정치적 결속력',  icon:'🤝', fill:'fill-unity',    hint:'우리 세력이 얼마나 뭉쳐 있는가'},
  {key:'security', label:'치안/생존 지수', icon:'🛡️', fill:'fill-security', hint:'12 이하로 떨어지면 몰락할 수 있다'}
];
const DANGER_LINE = 12;   // afterChoice()의 판정 기준과 같은 값 (막대 위 위험 구간 표시용)
const WARN_LINE = 25;     // 이 값 이하이면 경고 표시
// 좌–우 스펙트럼 위치(%) — 해방 직후 기준의 대략적 위치
const SPECTRUM = [ {id:'park', pos:9}, {id:'yeo', pos:36}, {id:'kim', pos:64}, {id:'lee', pos:91} ];

function shortDate(d){
  return d.replace(/년\s*/g,'.').replace(/월/g,'').replace(/\s*~\s*/g,'~').replace(/\.~/g,'~').replace(/\.$/,'');
}
function portrait(id, cls){
  const c = CHARACTERS[id];
  return `<img class="${cls} pbg-${id}" src="${PORTRAITS[id]}" alt="${c.name}">`;
}
function deltaChip(m, d){
  if(!d) return `<span class="dchip zero">${m.icon} ${m.label} <b>±0</b></span>`;
  return `<span class="dchip ${d>0?'up':'down'}">${m.icon} ${m.label} <b>${d>0?'▲':'▼'} ${Math.abs(d)}</b></span>`;
}
function scrollTopSmooth(){ window.scrollTo({top:0, behavior:'smooth'}); }

function chooseCharacter(id){
  state.charId = id;
  state.stats = {...CHARACTERS[id].stats};
  state.chapterIndex = 0;
  state.log = [];
  state.dead = false;
  show('screen-game');
  renderChapter();
}

/* =========================================================
   GAME SCREEN
========================================================= */
function statBar(m, prev, deltas){
  const v = state.stats[m.key];
  const from = prev ? prev[m.key] : v;
  const d = deltas ? deltas[m.key] : 0;
  const isSec = m.key === 'security';
  const danger = isSec && v <= WARN_LINE;
  return `
    <div class="hud-stat${danger?' is-danger':''}">
      <div class="lbl"><span>${m.icon} ${m.label}</span>
        <span class="val">${v}${d?`<em class="delta ${d>0?'up':'down'}">${d>0?'▲':'▼'}${Math.abs(d)}</em>`:''}</span></div>
      <div class="bar-track">
        ${isSec?`<div class="danger-zone" style="width:${DANGER_LINE}%"></div>`:''}
        <div class="bar-fill ${m.fill}" data-v="${v}" style="width:${from}%"></div>
      </div>
      ${danger?`<div class="warn">⚠ 신변 위험</div>`:''}
    </div>
  `;
}

function renderHud(prev, deltas){
  return `<div class="hud">${STAT_META.map(m=>statBar(m, prev, deltas)).join('')}</div>`;
}
function animateBars(){
  setTimeout(()=>{
    document.querySelectorAll('#screen-game .hud .bar-fill').forEach(el=>{ el.style.width = el.dataset.v + '%'; });
  }, 40);
}

function renderDots(){
  return `<div class="timeline">${CHAPTERS.map((ch,i)=>{
    const cls = i < state.chapterIndex ? 'done' : (i === state.chapterIndex ? 'active' : '');
    return `<div class="tl-step ${cls}"><div class="tl-node">${ch.num}</div><div class="tl-date">${shortDate(ch.date)}</div></div>`;
  }).join('')}</div>`;
}

/* ---------- [고민 장치] 설정: 주소 뒤에 붙여서 수업 방식에 맞게 조절 ----------
   (기본)          → 근거·가치 고르기 + '왜냐하면' 한 줄 쓰기
   ?reason=simple  → 이유 한 줄만 쓰기
   ?reason=off     → 이유 없이 진행 (시연·빠른 플레이용)
   ?fact=now       → 원래 방식처럼 선택 직후 '실제 역사' 여부 공개
-------------------------------------------------------------------------- */
const OPT = new URLSearchParams(location.search);
const REASON_MODE = ['off','simple'].includes(OPT.get('reason')) ? OPT.get('reason') : 'full';
const SHOW_FACT_NOW = OPT.get('fact') === 'now';
const REASON_MIN = 10;
const VALUES = ['원칙·명분','통일','대중의 지지','조직·세력','외교·국제 관계','나의 안전'];
let pending = { idx:null, sources:[], keep:null, risk:null, because:'' };

function josa(word, a, b){ // 받침 유무에 따라 을/를 선택
  if(!word) return a+'('+b+')';
  const code = word.charCodeAt(word.length-1) - 0xAC00;
  if(code < 0 || code > 11171) return a+'('+b+')';
  return (code % 28) ? a : b;
}
function esc(s){ return String(s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function briefOf(ci, id){ return BRIEFS[ci] && BRIEFS[ci][id]; }

function renderBrief(){
  const b = briefOf(state.chapterIndex, state.charId);
  if(!b) return '';
  return `
    <div class="brief">
      <div class="intel-card">
        <div class="intel-head">🗞️ 지금 당신에게 들어온 소식</div>
        <div class="intel-body">${b.card}</div>
      </div>
      <div class="adv-head">참모들의 조언 <span>— 세 사람의 말이 서로 다르다. 누구의 판단을 믿을 것인가?</span></div>
      <div class="advisors">
        ${b.adv.map((a,i)=>`
          <div class="advisor">
            <div class="adv-top"><span class="adv-badge">참모 ${'갑을병'[i]}</span><span class="adv-role">${a[0]}</span></div>
            <div class="adv-text">“${a[1]}”</div>
          </div>`).join('')}
      </div>
    </div>`;
}

function renderChapter(){
  const ch = CHAPTERS[state.chapterIndex];
  const c = CHARACTERS[state.charId];
  const choices = ch.choices[state.charId];
  pending = { idx:null, sources:[], keep:null, risk:null, because:'' };

  $('#screen-game').innerHTML = `
    ${renderHud()}
    ${renderDots()}
    <div class="chapter-banner">
      <div class="num">CHAPTER ${ch.num} / ${CHAPTERS.length}</div>
      <h2>${ch.title}</h2>
      <div class="date">${ch.date}</div>
    </div>
    <div class="panel event-panel">
      <div class="event-role">
        ${portrait(c.id,'role-portrait ring-'+c.id)}
        <div class="who">${c.name} <small>${c.tagLabel} · ${c.goal}</small></div>
      </div>
      <div class="event-text">${ch.lead[state.charId]}</div>
      ${renderBrief()}
      <div class="dilemma"><span class="dilemma-label">선택의 기로</span>${ch.dilemma}</div>
      <div class="choice-list" id="choice-list">
        ${choices.map((ch2,i)=>`
          <button class="choice" onclick="selectChoice(${i})">
            <span class="choice-key">${'ABC'[i]}</span><span class="choice-text">${ch2.text}</span>
          </button>
        `).join('')}
      </div>
      <div id="reason-slot"></div>
      <div id="result-slot"></div>
    </div>
  `;
  scrollTopSmooth();
}

/* ---------- 이유 쓰기: 근거 → 지키는 것/감수하는 것 → 왜냐하면 ---------- */
function reasonSources(){
  const b = briefOf(state.chapterIndex, state.charId);
  const list = [];
  if(b){
    list.push({key:'card', label:'소식 카드'});
    b.adv.forEach((a,i)=> list.push({key:'adv'+i, label:`참모 ${'갑을병'[i]} · ${a[0]}`, role:a[0]}));
  }
  list.push({key:'mine', label:'내 생각'});
  return list;
}
function chipGroup(name, items, selected, multi){
  return items.map(it=>{
    const key = typeof it === 'string' ? it : it.key;
    const label = typeof it === 'string' ? it : it.label;
    const on = multi ? selected.includes(key) : selected === key;
    return `<button type="button" class="rchip${on?' on':''}" onclick="toggleChip('${name}','${key}')">${esc(label)}</button>`;
  }).join('');
}
function renderReasonBox(){
  const slot = $('#reason-slot');
  const keyLetter = 'ABC'[pending.idx];
  const keepTxt = pending.keep ? `<b>${pending.keep}</b>${josa(pending.keep,'을','를')}` : '<i>○○</i>을(를)';
  const riskTxt = pending.risk ? `<b>${pending.risk}</b>${josa(pending.risk,'을','를')}` : '<i>△△</i>을(를)';
  const full = REASON_MODE === 'full';
  const prevText = $('#reason-input') ? $('#reason-input').value : pending.because;
  slot.innerHTML = `
    <div class="reason-box">
      <div class="reason-title">✍️ <b>${keyLetter}</b>를 고른 나의 판단 <span>결정 전까지 선택지를 바꿀 수 있습니다.</span></div>
      ${full ? `
      <div class="rstep"><div class="rq"><span class="rnum">1</span><span>무엇을 근거로 삼았나요?</span><small>여러 개 선택 가능</small></div>
        <div class="rchips">${chipGroup('sources', reasonSources(), pending.sources, true)}</div></div>
      <div class="rstep"><div class="rq"><span class="rnum">2</span><span>이 선택으로 <b class="k">지키려는 것</b>은?</span></div>
        <div class="rchips">${chipGroup('keep', VALUES, pending.keep, false)}</div></div>
      <div class="rstep"><div class="rq"><span class="rnum">3</span><span>그 대신 <b class="r">감수하는 것</b>은?</span></div>
        <div class="rchips">${chipGroup('risk', VALUES.filter(v=>v!==pending.keep), pending.risk, false)}</div></div>
      <div class="rstep"><div class="rq"><span class="rnum">4</span><span class="rsentence">나는 ${keepTxt} 지키기 위해 ${riskTxt} 감수한다. 왜냐하면…</span></div>` : `
      <div class="rstep"><div class="rq">왜 이 길을 택했나요? 소식이나 참모의 말 중 무엇을 근거로 삼았는지 적어 보세요.</div>`}
        <textarea id="reason-input" rows="2" maxlength="200" placeholder="${full ? '예) 참모 을의 말처럼 지금 미군정과 부딪히면 조직 전체가 위험해지기 때문이다.' : '예) 참모 을의 말처럼 ○○이라서, △△보다 □□이 더 중요하다고 판단했다.'}"></textarea>
      </div>
      <div class="reason-foot">
        <span id="reason-count"></span>
        <button class="btn small" id="reason-confirm" onclick="confirmChoice()" disabled>이 선택으로 결정</button>
      </div>
    </div>`;
  const ta = $('#reason-input');
  ta.value = prevText || '';
  ta.addEventListener('input', updateReason);
  updateReason();
}
function selectChoice(idx){
  if(REASON_MODE === 'off') return pickChoice(idx, '');
  const first = pending.idx === null;
  pending.idx = idx;
  document.querySelectorAll('#choice-list .choice').forEach((b,i)=> b.classList.toggle('selected', i===idx));
  renderReasonBox();
  if(first) setTimeout(()=>{ const s=$('#reason-slot'); s && s.scrollIntoView && s.scrollIntoView({behavior:'smooth', block:'start'}); }, 50);
}
function toggleChip(name, key){
  if(name === 'sources'){
    pending.sources = pending.sources.includes(key) ? pending.sources.filter(k=>k!==key) : [...pending.sources, key];
  } else if(name === 'keep'){
    pending.keep = pending.keep === key ? null : key;
    if(pending.risk === pending.keep) pending.risk = null;
  } else if(name === 'risk'){
    pending.risk = pending.risk === key ? null : key;
  }
  renderReasonBox();
}
function updateReason(){
  const ta = $('#reason-input'); if(!ta) return;
  pending.because = ta.value.trim();
  const n = pending.because.length;
  const missing = [];
  if(REASON_MODE === 'full'){
    if(!pending.sources.length) missing.push('① 근거');
    if(!pending.keep) missing.push('② 지키려는 것');
    if(!pending.risk) missing.push('③ 감수하는 것');
  }
  if(n < REASON_MIN) missing.push(`④ 이유 ${REASON_MIN}자 이상 (지금 ${n}자)`);
  const cnt = $('#reason-count');
  cnt.textContent = missing.length ? '남은 항목: ' + missing.join(', ') : '✅ 결정할 준비가 되었습니다';
  cnt.classList.toggle('ok', !missing.length);
  $('#reason-confirm').disabled = missing.length > 0;
}
function composeReason(r){
  if(!r) return '';
  if(!r.keep) return r.because || '';
  return `${r.keep}${josa(r.keep,'을','를')} 지키기 위해 ${r.risk}${josa(r.risk,'을','를')} 감수한다. 왜냐하면 ${r.because}`;
}
function confirmChoice(){
  if(pending.idx === null) return;
  const srcMap = Object.fromEntries(reasonSources().map(s=>[s.key, s]));
  const r = {
    because: pending.because,
    keep: REASON_MODE==='full' ? pending.keep : null,
    risk: REASON_MODE==='full' ? pending.risk : null,
    sources: REASON_MODE==='full' ? pending.sources.map(k=>srcMap[k]) : []
  };
  $('#reason-slot').innerHTML = `
    <div class="reason-done">
      <span>나의 판단</span>
      ${r.sources.length ? `<div class="rd-src">근거: ${r.sources.map(s=>esc(s.label)).join(', ')}</div>` : ''}
      ${esc(composeReason(r))}
    </div>`;
  pickChoice(pending.idx, r);
}

/* ---------- 결정 확정 → 수치 반영 (규칙은 원본과 동일) ---------- */
function pickChoice(idx, reason){
  const ch = CHAPTERS[state.chapterIndex];
  const c = CHARACTERS[state.charId];
  const choice = ch.choices[state.charId][idx];

  document.querySelectorAll('#choice-list .choice').forEach((b,i)=>{
    b.disabled = true;
    b.classList.remove('selected');
    if(i===idx) b.classList.add('picked');
  });

  const prev = {...state.stats};
  for(const k of ['public','intl','unity','security']){
    state.stats[k] = clamp(state.stats[k] + (choice.effects[k]||0));
  }
  const deltas = {};
  for(const k of ['public','intl','unity','security']) deltas[k] = state.stats[k] - prev[k];

  const r = (reason && typeof reason === 'object') ? reason : {because: reason || '', keep:null, risk:null, sources:[]};
  state.log.push({
    chapterNum: ch.num, chapterTitle: ch.title, choiceText: choice.text,
    fact: !!choice.fact, note: choice.note,
    reason: composeReason(r), reasonData: r, rethink: null
  });

  const tagHtml = SHOW_FACT_NOW
    ? (choice.fact ? `<span class="tag tag-fact">실제 역사의 선택</span>` : `<span class="tag tag-if">가상의 선택 (IF)</span>`)
    : `<span class="tag tag-result">선택의 결과</span>`;
  const isLast = state.chapterIndex === CHAPTERS.length - 1;
  const b = briefOf(state.chapterIndex, state.charId);

  $('#result-slot').innerHTML = `
    <div class="result-box">
      ${tagHtml}<br>
      ${choice.note}
      <div class="dchips">${STAT_META.map(m=>deltaChip(m, deltas[m.key])).join('')}</div>
      ${b && b.reveal ? `
        <div class="reveal"><span>🔍 그때 당신이 알 수 없었던 것</span>${b.reveal}
          ${REASON_MODE!=='off' ? `
          <div class="rethink">
            <div class="rethink-q">이 사실을 알았다면, 당신의 판단은 달라졌을까?</div>
            <div class="rethink-btns">
              <button type="button" class="rchip dark" onclick="setRethink('same', this)">그래도 같은 선택</button>
              <button type="button" class="rchip dark" onclick="setRethink('change', this)">다른 선택을 했을 것</button>
            </div>
          </div>` : ''}
        </div>` : ''}
      <div class="fact-hint">${SHOW_FACT_NOW ? '' : '실제 인물이 어떤 선택을 했고 왜 그랬는지는 마지막 역사 아카이브에서 공개됩니다.'}</div>
      <div style="margin-top:14px; text-align:right;">
        <button class="btn small" onclick="afterChoice()">${isLast ? '결과 보기' : '다음으로'}</button>
      </div>
    </div>
  `;

  $('#screen-game').querySelector('.hud').outerHTML = renderHud(prev, deltas);
  animateBars();
  setTimeout(()=>{ const rb=$('#result-slot .result-box'); if(rb && rb.scrollIntoView) rb.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 60);
}
function setRethink(v, btn){
  const last = state.log[state.log.length-1]; if(!last) return;
  last.rethink = v;
  btn.parentElement.querySelectorAll('.rchip').forEach(x=>x.classList.toggle('on', x===btn));
}

function afterChoice(){
  // [수정] 실제 역사 선택지가 있는 챕터에서 모두 실제 역사를 골랐다면 생존 판정을 건너뜀
  //        (실존 인물이 그 시점까지 살아남았으므로 정사 루트가 중간에 끊기지 않게 함)
  const onHistoryPath = state.log.every((l,i)=> l.fact || !CHAPTERS[i].choices[state.charId].some(cc=>cc.fact));
  if(state.stats.security <= 12 && !onHistoryPath){
    state.dead = true;
    return renderEnding();
  }
  state.chapterIndex++;
  if(state.chapterIndex >= CHAPTERS.length){
    return renderEnding();
  }
  renderChapter();
}

/* =========================================================
   ENDING
========================================================= */
function computeEnding(){
  if(state.dead) return {type:'tragic'};

  const factCount = state.log.filter(l=>l.fact).length;
  const s = state.stats;

  // [수정] 인물별 실제 역사 선택지 수가 4개 미만이면 그 전부를 기준으로 판정 (여운형: 3개)
  const factAvail = CHAPTERS.filter(ch=>ch.choices[state.charId].some(cc=>cc.fact)).length;
  if(factCount >= Math.min(4, factAvail)) return {type:'fact'};
  if(factCount <= 1 && s.public >= 68 && s.unity >= 60) return {type:'if', key:'moderate'};
  if(factCount <= 1 && s.intl >= 68) return {type:'if', key:'federal'};
  return {type:'if', key:'chaos'};
}

function renderEnding(){
  const c = CHARACTERS[state.charId];
  const result = computeEnding();

  let sealText, title, story;
  if(result.type==='tragic'){
    sealText = '悲劇'; title = '치안 붕괴 — 신변 위협 속 몰락';
    story = TRAGIC_ENDING_TEXT[state.charId];
  } else if(result.type==='fact'){
    const e = FACT_ENDINGS[state.charId];
    sealText = e.seal; title = e.title; story = e.story;
  } else {
    const e = IF_ENDINGS[result.key];
    sealText = e.seal; title = e.title; story = e.story;
  }

  const played = CHAPTERS.slice(0, state.log.length);

  // 한눈에 보는 요약: 챕터별 일치 도장
  let matchCount = 0, comparable = 0;
  const stamps = CHAPTERS.map((ch,i)=>{
    if(i >= state.log.length) return `<div class="stamp skip"><div class="st-mark">·</div><div class="st-lbl">${ch.num}장</div><div class="st-sub">진행 안 함</div></div>`;
    const hasFact = ch.choices[state.charId].some(cc=>cc.fact);
    if(!hasFact) return `<div class="stamp na"><div class="st-mark">?</div><div class="st-lbl">${ch.num}장</div><div class="st-sub">가상 국면</div></div>`;
    comparable++;
    const ok = state.log[i].fact; if(ok) matchCount++;
    return `<div class="stamp ${ok?'yes':'no'}"><div class="st-mark">${ok?'✓':'✕'}</div><div class="st-lbl">${ch.num}장</div><div class="st-sub">${ok?'역사와 일치':'다른 선택'}</div></div>`;
  }).join('');

  // 시작 → 최종 수치 비교
  const start = c.stats;
  const statCompare = STAT_META.map(m=>{
    const a = start[m.key], b = state.stats[m.key], d = b - a;
    return `
      <div class="cmp-row">
        <div class="cmp-lbl">${m.icon} ${m.label}</div>
        <div class="bar-track cmp-track">
          <div class="bar-fill ${m.fill}" style="width:${b}%"></div>
          <div class="cmp-start" style="left:${a}%" title="시작 ${a}"></div>
        </div>
        <div class="cmp-val">${a} → <b>${b}</b> <span class="${d>0?'up':d<0?'down':'zero'}">${d>0?'+'+d:d<0?'−'+Math.abs(d):'±0'}</span></div>
      </div>`;
  }).join('');

  const pattern = renderPattern();

  const archiveRows = played.map((ch,i)=>{
    const entry = state.log[i];
    const rd = entry.reasonData || {};
    const factChoice = ch.choices[state.charId].find(cc=>cc.fact);
    const hist = HIST_REASONS[i] && HIST_REASONS[i][state.charId];
    const matched = entry.fact;
    const verdict = !factChoice
      ? `<div class="match-na" style="margin-top:4px;">이 국면에는 실제 역사 선택지가 없음</div>`
      : `<div class="${matched?'match-yes':'match-no'}" style="margin-top:4px;">${matched?'✓ 역사와 일치':'✕ 역사와 다른 선택'}</div>`;
    const rethinkTxt = entry.rethink==='same' ? '숨은 사실을 알고도 같은 선택' : entry.rethink==='change' ? '숨은 사실을 알았다면 다른 선택' : '';
    return `
      <div class="archive-row">
        <div class="chlabel">Ch.${ch.num}<br><span style="font-weight:400; color:#8a7a55;">${ch.date}</span></div>
        <div>
          <span class="colhead">당신의 선택</span>
          <div class="yourpick">${entry.choiceText}</div>
          ${entry.reason ? `<div class="yourreason"><span class="colhead">나의 판단</span>
            ${rd.sources && rd.sources.length ? `<div class="rd-src">근거: ${rd.sources.map(s=>esc(s.label)).join(', ')}</div>` : ''}
            ${esc(entry.reason)}
            ${rethinkTxt ? `<div class="rd-rethink">↻ ${rethinkTxt}</div>` : ''}</div>` : ''}
        </div>
        <div>
          <span class="colhead">실제 역사</span>
          <div class="actual">${factChoice ? factChoice.text : '—'}
            ${verdict}
          </div>
          ${hist ? `<div class="histreason"><span class="colhead">실제 인물의 판단 근거</span>${hist}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');

  $('#screen-ending').innerHTML = `
    <div class="panel ending-panel">
      <div class="kicker">역사 아카이브 · 최종 기록</div>
      <div class="ending-head">
        ${portrait(c.id,'end-portrait ring-'+c.id)}
        <div class="ending-seal">${sealText.replace(/\n/g,'<br>')}</div>
      </div>
      <div class="end-who">${c.name}의 결말</div>
      <h2>${title}</h2>
      <div class="story">${story}</div>

      <div class="summary">
        <div class="summary-block">
          <h3>한눈에 보는 나의 선택 <span class="count">실제 역사와 일치 <b>${matchCount}</b> / ${comparable}</span></h3>
          <div class="stamps">${stamps}</div>
        </div>
        <div class="summary-block">
          <h3>수치 변화 <span class="count">│ 표시는 시작값</span></h3>
          ${statCompare}
        </div>
      </div>

      ${pattern}

      <div class="archive">
        <h3>역사 아카이브 리포트 — 나의 판단 vs ${c.name}의 실제 판단</h3>
        <div class="archive-note">※ '실제 인물의 판단 근거'는 역사학계의 일반적인 해석을 요약한 것으로, 다른 해석도 있습니다.</div>
        ${archiveRows}
      </div>

      ${REASON_MODE!=='off' ? `
      <div class="final-reflect">
        <div class="submit-title">🪞 마지막 성찰</div>
        <label for="final-reflect">내 판단 근거와 실제 인물의 판단 근거를 비교해 보세요. 가장 크게 달랐던 장면은 어디이고, 그 차이는 무엇 때문이었을까요?</label>
        <textarea id="final-reflect" rows="3" maxlength="400" placeholder="예) 2장에서 나는 안전을 지키려 했지만, 실제 인물은 명분을 더 중요하게 여겼다. 그 이유는…"></textarea>
      </div>` : ''}

      <div class="submit-box">
        <div class="submit-title">📋 활동 기록 제출</div>
        <div class="submit-row">
          <input id="student-id" type="text" placeholder="학번 이름 (예: 20712 홍길동)" maxlength="30">
          <button class="btn small" onclick="copyRecord()">기록 복사하기</button>
        </div>
        <div class="submit-help" id="copy-msg">복사한 뒤 선생님이 안내한 구글 클래스룸·설문지 칸에 붙여 넣으세요.</div>
      </div>
      <div class="footer-actions">
        <button class="btn secondary small" onclick="goSelect()">다른 인물로 다시 시작</button>
        <button class="btn small" onclick="restart()">처음으로</button>
      </div>
    </div>
  `;
  show('screen-ending');
  scrollTopSmooth();
}

/* 나의 판단 패턴: 지키려 한 것 / 감수한 것 / 근거로 삼은 것 */
function tally(arr){ const m={}; arr.filter(Boolean).forEach(v=>m[v]=(m[v]||0)+1); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function patternData(){
  const rds = state.log.map(l=>l.reasonData||{});
  const keep = tally(rds.map(r=>r.keep));
  const risk = tally(rds.map(r=>r.risk));
  const src = tally(rds.flatMap(r=>(r.sources||[]).map(s=> s.key==='card' ? '소식 카드' : s.key==='mine' ? '내 생각' : `'${s.role}' 참모`)));
  const changed = state.log.filter(l=>l.rethink==='change').length;
  const asked = state.log.filter(l=>l.rethink).length;
  return {keep, risk, src, changed, asked};
}
function renderPattern(){
  if(REASON_MODE !== 'full') return '';
  const p = patternData();
  if(!p.keep.length) return '';
  const chips = (list, cls) => list.map(([k,n])=>`<span class="pchip ${cls}">${esc(k)} <b>${n}</b></span>`).join('');
  const top = p.keep[0][0], topRisk = p.risk.length ? p.risk[0][0] : null;
  return `
    <div class="pattern">
      <h3>나의 판단 패턴</h3>
      <p class="p-sum">당신은 ${state.log.length}번의 선택에서 <b>${esc(top)}</b>${josa(top,'을','를')} 가장 자주 지키려 했고${topRisk?`, <b>${esc(topRisk)}</b>${josa(topRisk,'을','를')} 가장 자주 감수했다`:''}.</p>
      <div class="p-row"><span class="p-lbl">지키려 한 것</span>${chips(p.keep,'k')}</div>
      <div class="p-row"><span class="p-lbl">감수한 것</span>${chips(p.risk,'r')}</div>
      <div class="p-row"><span class="p-lbl">근거로 삼은 것</span>${chips(p.src,'s')}</div>
      ${p.asked ? `<div class="p-row"><span class="p-lbl">다시 생각하기</span><span class="pchip">숨은 사실을 알았다면 달라졌을 선택 <b>${p.changed}</b> / ${p.asked}</span></div>` : ''}
    </div>`;
}

function buildRecordText(){
  const c = CHARACTERS[state.charId];
  const r = computeEnding();
  const title = r.type==='tragic' ? '치안 붕괴 — 신변 위협 속 몰락' : r.type==='fact' ? FACT_ENDINGS[state.charId].title : IF_ENDINGS[r.key].title;
  const who = ($('#student-id') && $('#student-id').value.trim()) || '(학번·이름 미입력)';
  const lines = [`[여명의 갈림길] ${who}`, `인물: ${c.name} / 결말: ${title}`, ''];
  state.log.forEach((l,i)=>{
    const ch = CHAPTERS[i];
    const rd = l.reasonData || {};
    const hasFact = ch.choices[state.charId].some(cc=>cc.fact);
    const judge = !hasFact ? '가상 국면' : (l.fact ? '역사와 일치' : '역사와 다름');
    lines.push(`${ch.num}장 ${ch.title} (${ch.date})`);
    lines.push(`- 선택: ${l.choiceText} [${judge}]`);
    if(rd.sources && rd.sources.length) lines.push(`- 근거: ${rd.sources.map(s=>s.label).join(', ')}`);
    lines.push(`- 판단: ${l.reason || '(미입력)'}`);
    if(l.rethink) lines.push(`- 다시 생각하기: ${l.rethink==='same' ? '숨은 사실을 알고도 같은 선택' : '숨은 사실을 알았다면 다른 선택'}`);
  });
  const p = patternData();
  if(p.keep.length){
    lines.push('', `판단 패턴 — 지키려 한 것: ${p.keep.map(([k,n])=>`${k} ${n}`).join(', ')} / 감수한 것: ${p.risk.map(([k,n])=>`${k} ${n}`).join(', ')} / 근거: ${p.src.map(([k,n])=>`${k} ${n}`).join(', ')}`);
  }
  const fr = $('#final-reflect') ? $('#final-reflect').value.trim() : '';
  lines.push('', `마지막 성찰: ${fr || '(미입력)'}`);
  lines.push('', '수치(시작→최종): ' + STAT_META.map(m=>`${m.label} ${c.stats[m.key]}→${state.stats[m.key]}`).join(', '));
  return lines.join('\n');
}
function copyRecord(){
  const text = buildRecordText();
  const done = ok => { const m=$('#copy-msg'); if(m){ m.textContent = ok ? '✅ 복사되었습니다. 제출 칸에 붙여 넣으세요.' : '복사에 실패했습니다. 화면을 캡처해 제출하세요.'; m.classList.toggle('ok', ok); } };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok = document.execCommand('copy'); }catch(e){}
    ta.remove(); done(ok);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>done(true)).catch(fallback);
  } else fallback();
}

function restart(){
  state = {charId:null, stats:null, chapterIndex:0, log:[], dead:false};
  renderIntro();
  show('screen-intro');
}

/* =========================================================
   INIT
========================================================= */
